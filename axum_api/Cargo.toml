[package]
name = "axum_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
# Environment
dotenvy = "0.15.7"

postgres = "0.19.10"

# Serde
serde = {version = "1.0.219", features = ["derive", "serde_derive", "alloc"]}
serde_json = "1.0.140"

#sql
sqlx = {version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "macros"]}

#axum
tokio = {version = "1.45.1", features = ["full"]}
